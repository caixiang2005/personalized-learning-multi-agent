version: "3.8"

services:
  # ── 用户服务（认证/注册） ──
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    env_file:
      - ./backend/user-service/config/.env
    environment:
      - SERVICE_PORT=8001
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # ── 学习服务（画像/路径/练习/计划） ──
  learn-service:
    build:
      context: ./backend/learn-service
      dockerfile: Dockerfile
    container_name: learn-service
    ports:
      - "8002:8002"
    env_file:
      - ./backend/learn-service/config/.env
    environment:
      - SERVICE_PORT=8002
      - AGENT_SERVICE_URL=http://agent-service:8003
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # ── 智能体服务（DeepSeek RAG / 画像构建 / 路径规划 / 出题） ──
  agent-service:
    build:
      context: ./backend/agent-service
      dockerfile: Dockerfile
    container_name: agent-service
    ports:
      - "8003:8003"
    env_file:
      - ./backend/agent-service/.env
    environment:
      - SERVICE_PORT=8003
      - LEARN_SERVICE_URL=http://learn-service:8002
    restart: unless-stopped
    networks:
      - app-network

  # ── Redis（状态/会话缓存） ──
  redis:
    image: redis:7-alpine
    container_name: app-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
