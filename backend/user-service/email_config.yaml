# 复制为 email_config.yaml 并填写真实 SMTP 信息（该文件已加入 .gitignore）

smtp:
  host: smtp.qq.com
  port: 465
  use_ssl: true
  # QQ/163 等邮箱请使用「授权码」，不是登录密码
  username:your@qq.com
  password: 12345678abcd

from:
  address: your@qq.com
  name: 个性化学习系统

verification:
  code_length: 6
  expire_minutes: 10
  resend_interval_seconds: 60
