# 复制为 settings.yaml 并填写真实信息（settings.yaml 勿提交）

redis:
  # 须为可写主节点(master)。若 host 为只读从库(slave)，验证码/会话写入会失败
  host: 127.0.0.1
  port: 6379
  db: 0

smtp:
  host: smtp.qq.com
  port: 465
  use_ssl: true
  # QQ/163 等邮箱请使用「授权码」，不是登录密码
  username: your_email@qq.com
  password: your_smtp_auth_code

from:
  address: your_email@qq.com
  name: 个性化学习系统

verification:
  code_length: 6
  expire_seconds: 60
  resend_interval_seconds: 60
