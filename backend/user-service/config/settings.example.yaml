# 复制为 settings.yaml 并填写真实信息
# settings.yaml 含邮箱授权码等隐私，勿提交 / 勿随作品上交

redis:
  # 须为可写主节点；只读从库会导致验证码无法写入
  host: 127.0.0.1
  port: 6379
  db: 0

smtp:
  host: smtp.qq.com
  port: 465
  use_ssl: true
  # QQ/163 等请使用「授权码」，不是登录密码
  username: your_email@qq.com
  password: your_smtp_auth_code

from:
  address: your_email@qq.com
  name: 个性化学习系统

verification:
  code_length: 6
  expire_seconds: 60
  resend_interval_seconds: 60
