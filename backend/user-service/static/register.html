<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - 个性化学习系统</title>
    <link rel="stylesheet" href="/static/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-brand">
        <h1>创建账号</h1>
        <p>使用邮箱验证码完成注册</p>
      </div>

      <div class="auth-card">
        <p class="steps-hint">
          ① 填写邮箱并获取验证码 → ② 输入验证码与密码完成注册
        </p>

        <form id="form-register" novalidate>
          <div class="field">
            <label for="reg-email">邮箱</label>
            <input
              id="reg-email"
              type="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field-row" style="margin-bottom: 16px">
            <div class="field">
              <label for="reg-code">验证码</label>
              <input
                id="reg-code"
                type="text"
                name="code"
                placeholder="6 位验证码"
                inputmode="numeric"
                maxlength="6"
                required
              />
            </div>
            <button type="button" class="btn-code" id="btn-send-register-code">
              获取验证码
            </button>
          </div>

          <div class="field">
            <label for="reg-password">密码</label>
            <input
              id="reg-password"
              type="password"
              name="password"
              placeholder="至少 8 位"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <div class="field">
            <label for="reg-password2">确认密码</label>
            <input
              id="reg-password2"
              type="password"
              name="password2"
              placeholder="再次输入密码"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <button type="submit" class="btn-primary" id="btn-register">
            注册
          </button>
        </form>

        <div id="register-message" class="form-message error" hidden></div>

        <p class="auth-footer">
          已有账号？<a href="/login">去登录</a>
        </p>
      </div>
    </div>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/register.js"></script>
  </body>
</html>
