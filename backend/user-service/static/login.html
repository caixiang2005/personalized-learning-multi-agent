<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 个性化学习系统</title>
    <link rel="stylesheet" href="/static/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-brand">
        <h1>欢迎回来</h1>
        <p>登录后继续你的个性化学习之旅</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button
            type="button"
            class="auth-tab active"
            data-tab="password"
            role="tab"
            aria-selected="true"
          >
            邮箱 + 密码
          </button>
          <button
            type="button"
            class="auth-tab"
            data-tab="code"
            role="tab"
            aria-selected="false"
          >
            验证码登录
          </button>
        </div>

        <form id="form-password" class="form-panel active" novalidate>
          <div class="field">
            <label for="pwd-email">邮箱</label>
            <input
              id="pwd-email"
              type="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label for="pwd-password">密码</label>
            <input
              id="pwd-password"
              type="password"
              name="password"
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn-primary" id="btn-pwd-login">
            登录
          </button>
        </form>

        <form id="form-code" class="form-panel" novalidate>
          <div class="field">
            <label for="code-email">邮箱</label>
            <input
              id="code-email"
              type="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="field-row" style="margin-bottom: 16px">
            <div class="field">
              <label for="code-value">验证码</label>
              <input
                id="code-value"
                type="text"
                name="code"
                placeholder="6 位验证码"
                inputmode="numeric"
                maxlength="6"
                required
              />
            </div>
            <button type="button" class="btn-code" id="btn-send-login-code">
              获取验证码
            </button>
          </div>
          <button type="submit" class="btn-primary" id="btn-code-login">
            登录
          </button>
        </form>

        <div id="login-message" class="form-message error" hidden></div>

        <p class="auth-footer">
          还没有账号？<a href="/register">立即注册</a>
        </p>
      </div>
    </div>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
