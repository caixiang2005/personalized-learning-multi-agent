# Docker embedded DNS — re-resolve after container recreate
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location / {
        set $upstream_frontend frontend:80;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /n8n/ {
        set $upstream_n8n n8n:5678;
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://$upstream_n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/agent/ {
        set $upstream_agent agent-service:8003;
        proxy_pass http://$upstream_agent;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location /api/profile {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/learning-path {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 180s;
    }
    location /api/plan {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/chat {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /api/analytics {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/resources {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/exercises {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 180s;
    }
    location /api/safety {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/admin {
        set $upstream_learn learn-service:8002;
        proxy_pass http://$upstream_learn;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /static/ {
        set $upstream_user user-service:8001;
        proxy_pass http://$upstream_user;
        proxy_set_header Host $host;
    }

    location /api/ {
        set $upstream_user user-service:8001;
        proxy_pass http://$upstream_user;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
