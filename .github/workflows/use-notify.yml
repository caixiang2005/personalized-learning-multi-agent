name: 代码事件通知
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发送飞书通知
        run: |
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "📦 仓库：${{ github.repository }}\n👤 操作人：${{ github.actor }}\n🔁 事件：${{ github.event_name }}\n🌿 分支：${{ github.ref_name }}\n🔗 详情：${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            }
          }'
